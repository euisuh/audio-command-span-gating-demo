name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: lint (syntax errors, undefined names)
        run: pip install ruff && ruff check --select E9,F63,F7,F82 .
      - name: compile
        run: python -m py_compile allocation.py pilot.py runtime.py summarize.py
      - name: shell
        run: shellcheck fetch_kokoro.sh
      # pilot.py --selfcheck imports torch, audioseal, kokoro-onnx; not run here to avoid the ~3 GB install and model downloads.
